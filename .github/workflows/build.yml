name: Build and release a duckdb Pyodide wheel

on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        description: "git tag in duckdb/duckdb-python to build, e.g. v1.5.4"
        required: true
      xbuildenv_url:
        description: "Pyodide cross-build environment tarball URL"
        required: true
      platform_tag:
        description: "DuckDB platform tag baked into the binary, e.g. wasm_eh_pyodide"
        required: true
      pyodide_npm_version:
        description: "pyodide npm package version to build and smoke-test against, e.g. 314.0.3"
        required: true
      pyodide_build_version:
        description: "pin pyodide-build, e.g. 0.25.1 (leave blank for latest; older xbuildenvs declare a max_pyodide_build_version)"
        required: false
        default: ""
      release_tag:
        description: "Tag for the resulting GitHub Release, e.g. duckdb-v1.5.4-pyodide-314.0.3 (ignored when dry_run)"
        required: false
        default: ""
      dry_run:
        description: "Build and smoke-test only -- publish NO GitHub release. The wheel is still uploaded as a workflow artifact."
        required: false
        type: boolean
        default: false
      expected_wheel_version:
        description: "Version the built wheel must report (default: duckdb_version without its leading v). Use * to skip the check when building from a branch."
        required: false
        default: ""

jobs:
  build:
    name: Build duckdb ${{ inputs.duckdb_version }} for Pyodide ${{ inputs.pyodide_npm_version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::release_tag is required unless dry_run is set. Refusing now rather than after the build."
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: the wheel will be built, smoke-tested and uploaded as an artifact, but no release will be published."
          fi

      - uses: actions/checkout@v6

      # Pyodide ships exactly one CPython per release, so the Python version is
      # a function of the Pyodide version rather than an independent choice.
      # Deriving it here instead of taking it as a second dispatch input means
      # the pair can't be set inconsistently in the first place.
      #
      # Since the 314.x scheme Pyodide encodes CPython in its own major version
      # (314 -> 3.14, 315 -> 3.15). The older 0.x line does not, so those are
      # mapped explicitly; verified against each release's pyodide-lock.json.
      #
      # The same split decides the wheel's platform tag. pyodide-build >= 0.34.1
      # names wheels `pyemscripten_<abi>_wasm32` (PEP 783), but the micropip
      # bundled in the 0.x line only accepts `pyodide_<abi>_wasm32` and
      # `emscripten_<emsdk>_wasm32` -- installing a pyemscripten-tagged wheel
      # there fails with "built with Emscripten vpyemscripten.<abi>". Verified
      # against pyodide 0.28.3's own micropip 0.10.1 tag list. USE_LEGACY_PLATFORM
      # is pyodide-build's supported switch back to the `pyodide_` name.
      - name: Derive build settings from Pyodide version
        id: python
        env:
          PYODIDE_NPM_VERSION: ${{ inputs.pyodide_npm_version }}
        run: |
          major="${PYODIDE_NPM_VERSION%%.*}"
          rest="${PYODIDE_NPM_VERSION#*.}"
          minor="${rest%%.*}"
          if [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 300 )); then
            version="$(( major / 100 )).$(( major % 100 ))"
            legacy_platform=0
          elif [[ "$major" == "0" ]]; then
            legacy_platform=1
            case "$minor" in
              25)    version=3.11 ;;
              26|27) version=3.12 ;;
              28)    version=3.13 ;;
              *)
                echo "::error::Unknown legacy pyodide version '${PYODIDE_NPM_VERSION}'. Add its CPython mapping to this step (see that release's pyodide-lock.json '.info.python')."
                exit 1 ;;
            esac
          else
            echo "::error::Cannot parse pyodide npm version '${PYODIDE_NPM_VERSION}'."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "legacy_platform=${legacy_platform}" >> "$GITHUB_OUTPUT"
          echo "Pyodide ${PYODIDE_NPM_VERSION} -> CPython ${version}, USE_LEGACY_PLATFORM=${legacy_platform}"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python.outputs.version }}
          allow-prereleases: true

      - name: Install pyodide-build
        env:
          PYODIDE_BUILD_VERSION: ${{ inputs.pyodide_build_version }}
        run: |
          if [[ -n "$PYODIDE_BUILD_VERSION" ]]; then
            pip install "pyodide-build==${PYODIDE_BUILD_VERSION}"
          else
            pip install pyodide-build
          fi
          pip show pyodide-build | grep -i '^version:'

      # Install the requested cross-build environment up front. Until this runs,
      # `pyodide config get` reports pyodide-build's *default* environment, so
      # deriving the Emscripten version before this point pinned emsdk to
      # whatever that default happened to be rather than to the xbuildenv the
      # wheel is actually built against -- they agreed only by coincidence.
      - name: Install cross-build environment
        run: pyodide xbuildenv install --url "${{ inputs.xbuildenv_url }}"

      # The xbuildenv and the target Pyodide version are independent inputs and
      # nothing forces them to agree; a mismatch builds a wheel the runtime then
      # refuses to install. Check before spending ~12 minutes compiling DuckDB.
      - name: Check cross-build environment matches target Pyodide
        id: emscripten
        run: |
          version=$(python3 scripts/check_xbuildenv.py \
            --pyodide-npm-version "${{ inputs.pyodide_npm_version }}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Emscripten version: ${version}"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emscripten.outputs.version }}

      - name: Build wheel
        env:
          USE_LEGACY_PLATFORM: ${{ steps.python.outputs.legacy_platform }}
        run: |
          python3 scripts/build.py \
            --duckdb-version "${{ inputs.duckdb_version }}" \
            --xbuildenv-url "${{ inputs.xbuildenv_url }}" \
            --platform-tag "${{ inputs.platform_tag }}"

      - name: Show wheel
        run: ls -lah dist/*.whl

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install matching pyodide npm package
        run: npm install "pyodide@${{ inputs.pyodide_npm_version }}"

      - name: Smoke test (required to pass)
        run: |
          wheel=$(ls dist/*.whl | head -1)
          # duckdb.__version__ has no "v" prefix even though the git tag does.
          expected_version="${EXPECTED_WHEEL_VERSION:-${DUCKDB_VERSION#v}}"
          node test/smoke_test.mjs "$wheel" "$expected_version"
        env:
          DUCKDB_VERSION: ${{ inputs.duckdb_version }}
          EXPECTED_WHEEL_VERSION: ${{ inputs.expected_wheel_version }}

      - uses: actions/upload-artifact@v6
        with:
          name: duckdb-${{ inputs.duckdb_version }}-pyodide-py${{ steps.python.outputs.version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --title "${{ inputs.release_tag }}" \
            --notes "duckdb ${{ inputs.duckdb_version }} built for Pyodide ${{ inputs.pyodide_npm_version }} (Python ${{ steps.python.outputs.version }}, platform tag ${{ inputs.platform_tag }}), against xbuildenv ${{ inputs.xbuildenv_url }}." \
            dist/*.whl
